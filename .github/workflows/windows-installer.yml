name: Windows installer

on:
  push:
  pull_request:

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-uninstall:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build installer
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File build\Build-Installer.ps1

      - name: Install, verify, and uninstall
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File tests\Test-Installer.ps1

      - name: Check setup zip contents
        if: success()
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Join-Path (Get-Location) 'dist\LumiSetup-win.zip'))
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName.Replace('/', '\') })
            foreach ($needed in @('LumiHelper.exe', 'Install Lumi.cmd', 'Install-Lumi.ps1', 'lib\Ollama.ps1', 'lib\Origins.ps1', 'share\product.json', 'share\consent.txt', 'share\default-settings.json')) {
              if ($names -notcontains $needed) { throw ('Setup zip is missing ' + $needed) }
            }
          } finally {
            $zip.Dispose()
          }

      - name: Upload LumiSetup-win
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LumiSetup-win
          path: dist/LumiSetup-win.zip
          if-no-files-found: error

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: tests/out/
          if-no-files-found: ignore
